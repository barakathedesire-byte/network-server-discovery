<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Server Discovery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1021, #1b2a49);
      color: #eaf2ff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(13, 17, 31, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, #23395d, #3c6bb0);
      padding: 24px 28px;
    }
    h1 { margin: 0; }
    .warning {
      background: #4d3b00;
      border-left: 4px solid #ffca3a;
      color: #fff1b8;
      padding: 14px 18px;
      margin: 18px 24px;
      border-radius: 4px;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 24px;
    }
    .panel {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 20px;
    }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      color: #dfeaff;
      font-weight: 600;
    }
    input, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 1rem;
    }
    input {
      background: rgba(9,13,21,0.9);
      color: #f2f6ff;
    }
    button {
      margin-top: 16px;
      background: linear-gradient(135deg, #4f9cff, #6d5ef5);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }
    .checkboxes {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    .checkboxes label {
      font-weight: 400;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .results {
      grid-column: 1 / -1;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 20px;
    }
    .summary {
      margin-bottom: 18px;
      padding: 12px 16px;
      background: rgba(71, 116, 255, 0.12);
      border: 1px solid rgba(120, 157, 255, 0.4);
      border-radius: 8px;
    }
    .host-card {
      background: rgba(255,255,255,0.03);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-left: 8px;
    }
    .online { background: rgba(39, 174, 96, 0.2); color: #7ef0ad; }
    .offline { background: rgba(255, 107, 107, 0.2); color: #ffc2c2; }
    .service {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: monospace;
    }
    .vhost {
      background: rgba(106, 191, 255, 0.08);
      border-left: 3px solid #8ec5ff;
      padding: 8px 10px;
      margin-top: 6px;
      border-radius: 4px;
    }
    .small {
      font-size: 0.9rem;
      color: #cfe3ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔎 Network Server Discovery</h1>
    </header>

    <div class="warning">
      This tool is for authorized network discovery and permitted security assessments only. Ensure you have explicit permission before scanning any network or system.
    </div>

    <div class="content">
      <div class="panel">
        <h2>Scan Configuration</h2>
        <form id="scanForm">
          <label for="target">Target</label>
          <input id="target" type="text" placeholder="192.168.1.0/24 or example.com" required />

          <label for="ports">Ports (comma-separated)</label>
          <input id="ports" type="text" placeholder="22,80,443,3306" />

          <label for="threads">Threads</label>
          <input id="threads" type="number" value="20" min="1" max="100" />

          <label for="timeout">Timeout (seconds)</label>
          <input id="timeout" type="number" value="1.5" min="0.5" max="10" step="0.5" />

          <div class="checkboxes">
            <label><input id="vhostScan" type="checkbox" /> Vhost scan</label>
            <label><input id="dnsEnum" type="checkbox" /> DNS enum</label>
          </div>

          <button type="submit">Start scan</button>
        </form>
      </div>

      <div class="panel">
        <h2>Off-Network Server</h2>
        <form id="offlineForm">
          <label for="offlineIp">IP</label>
          <input id="offlineIp" type="text" placeholder="10.0.0.12" />

          <label for="offlineHost">Hostname</label>
          <input id="offlineHost" type="text" placeholder="db.internal.local" />

          <label for="offlineServices">Services</label>
          <input id="offlineServices" type="text" placeholder="SSH, PostgreSQL" />

          <button type="button" onclick="registerOfflineServer()">Register server</button>
        </form>
      </div>

      <div class="results" id="resultsContainer">
        <div class="small">No scan results yet.</div>
      </div>
    </div>
  </div>

  <script>
    let currentScanId = null;

    document.getElementById('scanForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const target = document.getElementById('target').value.trim();
      const ports = document.getElementById('ports').value.trim();
      const threads = document.getElementById('threads').value;
      const timeout = document.getElementById('timeout').value;
      const vhostScan = document.getElementById('vhostScan').checked;
      const dnsEnum = document.getElementById('dnsEnum').checked;

      const resultsContainer = document.getElementById('resultsContainer');
      resultsContainer.innerHTML = '<div class="small">Scanning...</div>';

      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target, ports, threads, timeout, vhost_scan: vhostScan, dns_enum: dnsEnum })
        });
        const json = await response.json();
        if (!response.ok) {
          resultsContainer.innerHTML = `<div class="small" style="color:#ffb4b4;">Error: ${json.error}</div>`;
          return;
        }

        currentScanId = json.scan_id;
        renderResults(json.data);
      } catch (error) {
        resultsContainer.innerHTML = `<div class="small" style="color:#ffb4b4;">Error: ${error.message}</div>`;
      }
    });

    function renderResults(data) {
      const resultsContainer = document.getElementById('resultsContainer');
      let html = `<div class="summary"><strong>Target:</strong> ${data.target} | <strong>Hosts:</strong> ${data.hosts_discovered} | <strong>Services:</strong> ${data.total_services} | <strong>Duration:</strong> ${data.duration_seconds}s</div>`;

      if (!data.hosts || data.hosts.length === 0) {
        html += '<div class="small">No hosts discovered.</div>';
        resultsContainer.innerHTML = html;
        return;
      }

      data.hosts.forEach(host => {
        const statusClass = host.alive ? 'online' : 'offline';
        const statusText = host.alive ? 'online' : 'offline';
        html += `<div class="host-card">
          <h3>${host.ip} <span class="badge ${statusClass}">${statusText}</span></h3>
          <div class="small">Hostname: ${host.hostname || 'N/A'}</div>
          <div class="small">Open ports: ${host.open_ports && host.open_ports.length ? host.open_ports.join(', ') : 'None'}</div>
        `;

        if (host.services && host.services.length) {
          host.services.forEach(service => {
            const banner = service.banner ? ` - ${service.banner.substring(0, 60)}` : '';
            html += `<div class="service">${service.name} : ${service.port} (${Math.round(service.confidence * 100)}% confidence)${banner}</div>`;
          });
        }

        if (host.vhosts && host.vhosts.length) {
          html += '<div class="small" style="margin-top:10px;">Virtual hosts:</div>';
          host.vhosts.forEach(vhost => {
            html += `<div class="vhost">${vhost.vhost} (${vhost.protocol}:${vhost.port})</div>`;
          });
        }

        html += '</div>';
      });

      if (data.offline_servers && data.offline_servers.length) {
        html += '<div class="host-card"><h3>Off-network servers</h3>';
        data.offline_servers.forEach(server => {
          html += `<div class="service">${server.ip} | ${server.hostname} | ${server.services.join(', ') || 'unknown'}</div>`;
        });
        html += '</div>';
      }

      html += `<button type="button" onclick="downloadResults()">Download JSON</button>`;
      resultsContainer.innerHTML = html;
    }

    function registerOfflineServer() {
      if (!currentScanId) {
        alert('Run a scan before registering an off-network server.');
        return;
      }
      const ip = document.getElementById('offlineIp').value.trim();
      const hostname = document.getElementById('offlineHost').value.trim();
      const services = document.getElementById('offlineServices').value.split(',').map(s => s.trim()).filter(Boolean);

      fetch('/api/offline-server', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scan_id: currentScanId, ip, hostname, services })
      }).then(response => response.json()).then(json => {
        if (json.success) {
          alert('Offline server registered.');
          document.getElementById('offlineForm').reset();
        } else {
          alert(json.error || 'Failed to register offline server.');
        }
      });
    }

    function downloadResults() {
      if (!currentScanId) return;
      window.location.href = `/api/scan/${currentScanId}/export`;
    }
  </script>
</body>
</html>
